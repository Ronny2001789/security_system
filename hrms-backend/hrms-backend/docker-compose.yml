services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: moronza2001
    ports:
      - "5432:5432"
    healthcheck:                  # ← Add this block
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: hrms-backend
    container_name: hrms-container
    depends_on:
      postgres:
        condition: service_healthy   # ← Change to this
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hrms
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8081:8081"